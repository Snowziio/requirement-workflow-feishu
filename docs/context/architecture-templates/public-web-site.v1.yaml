# Generated from template: public-web-site.v1
# Placeholders: {project} {pkg} {date} {{display_name}} {{brief}} {{tech_stack}}
display_name: "{{display_name}}"
brief: "{{brief}}"
tech_stack_notes: "{{tech_stack}}"
version: "{date}"
project: "{project}"
category: public-web-site
status: bootstrap

tech_stack:
  frontend: "React + TypeScript"
  backend: "FastAPI (Python 3.11)"
  database: "PostgreSQL"
  cdn: "CloudFront"
  deployment: "single-host Docker Compose"

# ── UI / Design (by design-phase spec) ─────────
frontend:
  subpath: "src/{pkg}_webapp"
  tech_stack:
    framework: "React 18 + TypeScript"
    build: "Vite 5.x"                # 若需 SSR 可覆盖为 Next.js 14
    routing: "react-router 6"
    styling: "Tailwind CSS 3.x"
    component_library: "shadcn/ui"
    icons: "lucide-react"
    fonts: "IBM Plex (Sans/SC/Mono)"

design:
  claude_design_project_url: ""
  design_system_snapshot_path: "design/system/"
  pages_registry_path: "design/PAGES.yaml"
  archive_path: "design/archive/"

modules:
  - name: "{pkg}_web"
    description: "面向 C 端的 H5/SSR 前端页面。"
    repo_path: "src/{pkg}/web"
    public_api: []
    status: bootstrap
  - name: "{pkg}_api"
    description: "对外 REST API 服务。"
    repo_path: "src/{pkg}/api"
    public_api: []
    status: bootstrap
  - name: "{pkg}_worker"
    description: "轻量异步任务处理。"
    repo_path: "src/{pkg}/worker"
    public_api: []
    status: bootstrap

services: []
data_models: []
external_dependencies:
  - "浏览器静态资源 CDN"
  - "SMTP / 短信网关（如有通知场景）"
