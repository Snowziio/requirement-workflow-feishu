# Generated from template: miniprogram.v1
# Placeholders: {project} {pkg} {date} {{display_name}} {{brief}} {{tech_stack}}
display_name: "{{display_name}}"
brief: "{{brief}}"
tech_stack_notes: "{{tech_stack}}"
version: "{date}"
project: "{project}"
category: miniprogram
status: bootstrap

tech_stack:
  client: "微信小程序 (原生框架)"
  backend: "FastAPI (Python 3.11)"
  database: "PostgreSQL"
  deployment: "single-host Docker Compose"

# ── UI / Design (by design-phase spec) ─────────
frontend:
  subpath: "src/{pkg}_miniapp"
  tech_stack:
    framework: "Taro 4.x + React + TypeScript"
    build: "Taro CLI"
    routing: "Taro built-in"
    styling: "Taro + SCSS"
    component_library: "NutUI"
    icons: "lucide-react"
    fonts: "system-ui"

design:
  claude_design_project_url: ""
  design_system_snapshot_path: "design/system/"
  pages_registry_path: "design/PAGES.yaml"
  archive_path: "design/archive/"

modules:
  - name: "{pkg}_miniapp"
    description: "小程序端页面与业务逻辑。"
    repo_path: "src/{pkg}/miniapp"
    public_api: []
    status: bootstrap
  - name: "{pkg}_api"
    description: "小程序后端 REST API。"
    repo_path: "src/{pkg}/api"
    public_api: []
    status: bootstrap
  - name: "{pkg}_wx_gateway"
    description: "微信登录 / 支付 / 消息回调封装。"
    repo_path: "src/{pkg}/wx_gateway"
    public_api: []
    status: bootstrap

services: []
data_models: []
external_dependencies:
  - "微信开放平台 OpenAPI"
