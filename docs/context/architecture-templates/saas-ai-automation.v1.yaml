# Generated from template: saas-ai-automation.v1
# Placeholders: {project} {pkg} {date} {{display_name}} {{brief}} {{tech_stack}}
display_name: "{{display_name}}"
brief: "{{brief}}"
tech_stack_notes: "{{tech_stack}}"
version: "{date}"
project: "{project}"
category: saas-ai-automation
status: bootstrap

tech_stack:
  backend: "FastAPI (Python 3.11)"
  llm: "Anthropic API (claude-sonnet-4-6)"
  database: "PostgreSQL"
  queue: "轻量进程内异步队列"
  deployment: "single-host Docker Compose"

# ── UI / Design (by design-phase spec) ─────────
frontend:
  subpath: "src/{pkg}_webapp"
  tech_stack:
    framework: "React 18 + TypeScript"
    build: "Vite 5.x"
    routing: "react-router 6"
    styling: "Tailwind CSS 3.x"
    component_library: "shadcn/ui"
    icons: "lucide-react"
    fonts: "IBM Plex (Sans/SC/Mono)"

design:
  claude_design_project_url: ""
  design_system_snapshot_path: "design/system/"
  pages_registry_path: "design/PAGES.yaml"
  archive_path: "design/archive/"

modules:
  - name: "{pkg}_saas_connectors"
    description: "对接外部 SaaS 工具的适配器集合。"
    repo_path: "src/{pkg}/saas_connectors"
    public_api: []
    status: bootstrap
  - name: "{pkg}_ai_pipeline"
    description: "基于 LLM 的数据抽取 / 生成 / 增强流水线。"
    repo_path: "src/{pkg}/ai_pipeline"
    public_api: []
    status: bootstrap
  - name: "{pkg}_automation_engine"
    description: "工作流编排与自动化触发。"
    repo_path: "src/{pkg}/automation_engine"
    public_api: []
    status: bootstrap
  - name: "{pkg}_webhook_gateway"
    description: "外部事件接入与回调分发。"
    repo_path: "src/{pkg}/webhook_gateway"
    public_api: []
    status: bootstrap

services: []
data_models: []
external_dependencies:
  - "对接 SaaS 工具 OpenAPI"
  - "Anthropic API"
