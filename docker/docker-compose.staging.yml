services:
  coordinator-service:
    image: ${ACR_REGISTRY}/${ACR_NAMESPACE}/${APP_NAME}:${IMAGE_TAG:-latest}
    ports:
      - "${STAGING_PORT:-8004}:8003"
    environment:
      - SERVICE_PORT=8003
      - FEISHU_APP_ID=${FEISHU_APP_ID}
      - FEISHU_APP_SECRET=${FEISHU_APP_SECRET}
      - FEISHU_VERIFICATION_TOKEN=${FEISHU_VERIFICATION_TOKEN}
      - FEISHU_ENCRYPT_KEY=${FEISHU_ENCRYPT_KEY}
      - FEISHU_LOG_LEVEL=${FEISHU_LOG_LEVEL:-INFO}
      - FEISHU_CREATION_GROUP_CHAT_ID=${FEISHU_CREATION_GROUP_CHAT_ID}
      - FEISHU_BITABLE_APP_TOKEN=${FEISHU_BITABLE_APP_TOKEN}
      - FEISHU_BITABLE_TABLE_ID=${FEISHU_BITABLE_TABLE_ID}
      - FEISHU_BITABLE_PROJECT_CONFIGS_TABLE_ID=${FEISHU_BITABLE_PROJECT_CONFIGS_TABLE_ID:-}
      - FEISHU_DOC_FOLDER_TOKEN=${FEISHU_DOC_FOLDER_TOKEN}
      - FEISHU_BASE_URL=${FEISHU_BASE_URL:-https://my.feishu.cn}
      - FEISHU_USER_ID_TYPE=${FEISHU_USER_ID_TYPE:-open_id}
      - REQUIREMENT_TEMPLATE_URL=${REQUIREMENT_TEMPLATE_URL}
      - UI_TEMPLATE_URL=${UI_TEMPLATE_URL}
      - REVIEW_TEMPLATE_URL=${REVIEW_TEMPLATE_URL}
      - OPENCLAW_AUTHOR_AGENT_NAME=${OPENCLAW_AUTHOR_AGENT_NAME:-需求构造助手}
      - OPENCLAW_REVIEWER_AGENT_NAME=${OPENCLAW_REVIEWER_AGENT_NAME:-需求审查助手}
      - AUTHOR_AGENT_CHAT_URL_TEMPLATE=${AUTHOR_AGENT_CHAT_URL_TEMPLATE}
      - PROJECT_GROUP_NAME_TEMPLATE=${PROJECT_GROUP_NAME_TEMPLATE:-{project} 需求群}
      - STATE_STORE_PATH=${STATE_STORE_PATH:-/app/state/coordinator_state.json}
    volumes:
      - coordinator-service-staging-state:/app/state
    restart: unless-stopped

volumes:
  coordinator-service-staging-state:
