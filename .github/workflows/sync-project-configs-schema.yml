name: Sync Bitable project_configs schema

on:
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Dry run (do not create fields)"
        required: false
        type: boolean
        default: false

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install deps
        run: |
          pip install -r requirements.txt

      - name: Run sync
        env:
          FEISHU_APP_ID: ${{ secrets.FEISHU_APP_ID }}
          FEISHU_APP_SECRET: ${{ secrets.FEISHU_APP_SECRET }}
          FEISHU_BITABLE_APP_TOKEN: ${{ secrets.FEISHU_BITABLE_APP_TOKEN }}
          FEISHU_BITABLE_PROJECT_CONFIGS_TABLE_ID: ${{ secrets.FEISHU_BITABLE_PROJECT_CONFIGS_TABLE_ID }}
        run: |
          if [ "${{ inputs.dry_run }}" = "true" ]; then
            python scripts/sync_project_configs_schema.py --dry-run
          else
            python scripts/sync_project_configs_schema.py
          fi
