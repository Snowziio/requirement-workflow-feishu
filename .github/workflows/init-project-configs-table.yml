name: Init Project Configs Table

on:
  workflow_dispatch:

jobs:
  init:
    runs-on: ubuntu-latest
    outputs:
      table_id: ${{ steps.init.outputs.table_id }}
      table_name: ${{ steps.init.outputs.table_name }}
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Create ProjectConfigs table in existing Bitable app
        id: init
        env:
          FEISHU_APP_ID: ${{ secrets.FEISHU_APP_ID }}
          FEISHU_APP_SECRET: ${{ secrets.FEISHU_APP_SECRET }}
          FEISHU_BITABLE_APP_TOKEN: ${{ secrets.FEISHU_BITABLE_APP_TOKEN }}
        run: python scripts/init_project_configs_table.py

      - name: Show outputs
        run: |
          echo "table_id=${{ steps.init.outputs.table_id }}"
          echo "table_name=${{ steps.init.outputs.table_name }}"
